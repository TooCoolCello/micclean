[package]
name = "micclean"
version = "0.1.1"
edition = "2024"
default-run = "micclean"

[[bin]]
name = "micclean-setup"
path = "src/setup.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
nnnoiseless = "0.5"
raw-window-handle = "0.6"
realfft = "3.5.1"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sonora = "0.2"
tray-icon = "0.26.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
