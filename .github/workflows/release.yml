name: Release

# Push a tag like v0.2.0 to build and publish a release: the Windows setup and update feed
# (Velopack: MicClean-win-Setup.exe, releases.win.json and its packages) and the Mac disk image
# (MicClean.dmg). The tag has to match the version in Cargo.toml, because the packages carry that
# version. v0.12.0 also publishes the bridge from 0.11 and older on Windows (MicClean-Setup.exe);
# no other version does.
#
# Releases go to a separate public repo, TooCoolCello/tacet-releases (this repo is private):
# the downloads, the update feed and the notes, no source. Installed copies read updates there
# (src/update.rs, REPO_URL; a Mac's dmg link too). The publish job writes there with
# RELEASES_TOKEN, a fine-grained token with Contents: read and write on that one repo only, kept
# as this repo's Actions secret. That repo needs one commit (a README) for the tag to start from.
# The notes are the tagged commit's message body (the "Release x.y.z" commit's bullet list).
#
# Dry run: start it by hand (Actions -> Release -> Run workflow, or `gh workflow run release.yml
# --ref <branch>`). It builds and tests everything and uploads it only as workflow artifacts:
# the publish job runs for a pushed tag only, never for a run started by hand.
#
# No Mac update feed until one-click updates have been tried on a Mac: the Mac build leaves
# MICCLEAN_MAC_UPDATES unset (see build-mac.sh), so it makes only MicClean.dmg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build runs every dependency's build script and test, so it can only read the repo.
# Only the publish job, which runs nothing from the repo, can write a release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config while the build runs.
          persist-credentials: false

      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # A tag like v0.9.0-rc1 would be published as the latest release, and every
          # installed copy would be offered it.
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "tag $env:GITHUB_REF_NAME isn't vX.Y.Z" }
          $want = "v" + ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME doesn't match Cargo.toml ($want)" }

      # vpk, pinned in dotnet-tools.json.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: cargo test --locked

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      # One SHA-256 file per download. The bridge's is what 0.11 and older check before running it.
      - name: Checksum
        shell: pwsh
        run: |
          Move-Item dist\MicClean-Setup.exe dist\releases\
          foreach ($f in 'MicClean-win-Setup.exe', 'MicClean-Setup.exe') {
            $h = (Get-FileHash dist\releases\$f -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii dist\releases\$f.sha256
          }

      # The release's notes: the tagged commit's message without its title line ("Release x.y.z")
      # and its trailers (Co-Authored-By).
      - name: Release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\notes | Out-Null
          $body = (git log -1 --format=%b | Where-Object { $_ -notmatch '^[A-Za-z-]+-by: ' }) -join "`n"
          if (-not $body.Trim()) { $body = "MicClean $env:GITHUB_REF_NAME" }
          $body.Trim() | Out-File -Encoding utf8 dist\notes\notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/releases/

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: dist/notes/

  mac:
    # Apple Silicon runner; build-mac.sh cross-builds the Intel half into the same app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build disk image
        run: bash build-mac.sh

      - name: Checksum
        run: |
          mkdir -p dist/releases
          mv dist/MicClean.dmg dist/releases/
          cd dist/releases
          shasum -a 256 MicClean.dmg > MicClean.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/releases/

  publish:
    needs: [build, mac]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Nothing here writes to this repo: the release goes to the releases repo with RELEASES_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: TooCoolCello/tacet-releases
        run: |
          set -euo pipefail
          # The two builds share one release, so no file may have the same name in both.
          clash=$(comm -12 <(ls dist/windows | sort) <(ls dist/mac | sort) | grep -v -e '^RELEASES' -e '^assets\.' || true)
          if [ -n "$clash" ]; then echo "Windows and Mac both made: $clash"; exit 1; fi
          files=()
          for d in dist/windows dist/mac; do  # not dist/notes
            for f in "$d"/*; do
              case "$(basename "$f")" in
                RELEASES*|assets.*.json) ;; # vpk's own bookkeeping, not read by the app
                MicClean-Setup.exe*) if [ "$GITHUB_REF_NAME" = v0.12.0 ]; then files+=("$f"); fi ;;
                *) files+=("$f") ;;
              esac
            done
          done
          if [ -z "$GH_TOKEN" ]; then echo "no RELEASES_TOKEN secret" >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$RELEASES_REPO" \
            --title "MicClean ${GITHUB_REF_NAME#v}" --notes-file dist/notes/notes.md
