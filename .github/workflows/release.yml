name: Release

# Push a tag like v0.2.0 to build both installers (Windows setup, Mac disk image) and publish
# them. The tag has to match the version in Cargo.toml, because the in-app updater compares
# the two. Run it by hand (Actions -> Release -> Run workflow) to only build them, as artifacts
# to try out, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build runs every dependency's build script and test, so it can only read the repo.
# Only the publish job, which runs nothing from the repo, can write a release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config while the build runs.
          persist-credentials: false

      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # A tag like v0.9.0-rc1 would be published as the latest release, and every
          # installed copy's updater would fail on its version number.
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "tag $env:GITHUB_REF_NAME isn't vX.Y.Z" }
          $want = "v" + ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME doesn't match Cargo.toml ($want)" }

      - name: Test
        run: cargo test --locked

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\MicClean-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MicClean-Setup.exe" | Out-File -Encoding ascii dist\MicClean-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/MicClean-Setup.exe
            dist/MicClean-Setup.exe.sha256

  mac:
    # Apple Silicon runner; build-mac.sh cross-builds the Intel half into the same app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build disk image
        run: bash build-mac.sh

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 MicClean.dmg > MicClean.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/MicClean.dmg
            dist/MicClean.dmg.sha256

  publish:
    needs: [build, mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MicClean-Setup.exe dist/MicClean-Setup.exe.sha256 dist/MicClean.dmg dist/MicClean.dmg.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
