name: Release

# Push a tag like v0.2.0 to build both installers and update feeds (Velopack: Windows setup, Mac
# .pkg, releases.win.json / releases.osx.json and their packages) and publish them. The tag has to
# match the version in Cargo.toml, because the packages carry that version. Run it by hand
# (Actions -> Release -> Run workflow) to only build them, as artifacts to try out, without
# publishing anything. v0.12.0 also publishes the bridge from 0.11 and older (MicClean-Setup.exe,
# MicClean.dmg); no other version does.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build runs every dependency's build script and test, so it can only read the repo.
# Only the publish job, which runs nothing from the repo, can write a release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config while the build runs.
          persist-credentials: false

      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # A tag like v0.9.0-rc1 would be published as the latest release, and every
          # installed copy would be offered it.
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "tag $env:GITHUB_REF_NAME isn't vX.Y.Z" }
          $want = "v" + ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME doesn't match Cargo.toml ($want)" }

      # vpk, pinned in dotnet-tools.json.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: cargo test --locked

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      # One SHA-256 file per download. The bridge's is what 0.11 and older check before running it.
      - name: Checksum
        shell: pwsh
        run: |
          Move-Item dist\MicClean-Setup.exe dist\releases\
          foreach ($f in 'MicClean-win-Setup.exe', 'MicClean-Setup.exe') {
            $h = (Get-FileHash dist\releases\$f -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii dist\releases\$f.sha256
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/releases/

  mac:
    # Apple Silicon runner; build-mac.sh cross-builds the Intel half into the same app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: cargo test --locked

      - name: Build installer
        run: bash build-mac.sh

      - name: Checksum
        run: |
          mv dist/MicClean.dmg dist/releases/
          cd dist/releases
          for f in MicClean-osx-Setup.pkg MicClean.dmg; do shasum -a 256 "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/releases/

  publish:
    needs: [build, mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The two builds share one release, so no file may have the same name in both.
          clash=$(comm -12 <(ls dist/windows | sort) <(ls dist/mac | sort) | grep -v -e '^RELEASES' -e '^assets\.' || true)
          if [ -n "$clash" ]; then echo "Windows and Mac both made: $clash"; exit 1; fi
          files=()
          for d in dist/windows dist/mac; do
            for f in "$d"/*; do
              case "$(basename "$f")" in
                RELEASES*|assets.*.json) ;; # vpk's own bookkeeping, not read by the app
                MicClean-Setup.exe*|MicClean.dmg*) if [ "$GITHUB_REF_NAME" = v0.12.0 ]; then files+=("$f"); fi ;;
                *) files+=("$f") ;;
              esac
            done
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
